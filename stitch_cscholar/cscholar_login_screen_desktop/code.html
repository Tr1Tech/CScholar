<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - CScholar CEIT Thesis &amp; Capstone Repository</title>
<!-- Google Fonts: Poppins (Headings) and Inter (Body) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#009900',
              darkgreen: '#005a1e',
              deepergreen: '#00471b',
              forest: '#043e18',
              gold: '#F9DC07',
              accentYellow: '#F9DC07',
              accentOrange: '#FF9900',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-typography">
    .font-heading {
      font-family: 'Poppins', sans-serif;
    }
    .font-body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<style data-purpose="layout-decorations">
    /* Subtle glow and decorative wave positioning */
    .brand-wave-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      overflow: hidden;
      line-height: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen bg-[#f3f4f6] flex items-center justify-center p-4 md:p-6 lg:p-10 font-body text-slate-800 antialiased selection:bg-[#009900] selection:text-white">
<!-- BEGIN: MainLoginCardContainer -->
<main class="w-full max-w-5xl min-h-[660px] bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row border border-slate-100" data-purpose="desktop-login-card">
<!-- BEGIN: LeftBrandedPanel -->
<!-- Left panel featuring deep forest green styling, brand emblem, educational tagline, and lower gold wave accents -->
<section class="relative w-full md:w-5/12 bg-gradient-to-b from-[#005a1e] via-[#00471b] to-[#043313] text-white p-8 sm:p-12 flex flex-col justify-between overflow-hidden" data-purpose="branding-panel">
<!-- Subtle background outlined mortarboard/graduation graphic -->
<div aria-hidden="true" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-10">
<svg class="w-96 h-96 text-white transform -translate-y-8" fill="none" stroke="currentColor" stroke-width="1" viewbox="0 0 24 24">
<path d="M12 14l9-5-9-5-9 5 9 5z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 14v7" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M20 9v5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Top Brand identity header & logo -->
<div class="relative z-10 flex flex-col items-center text-center mt-6">
<!-- Logo Emblem -->
<div class="flex items-center justify-center mb-3">
<div class="relative w-16 h-16 flex items-center justify-center">
<!-- Stylized book leaves / flame shape -->
<svg class="w-14 h-14" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<!-- Central yellow sprout / flame accent -->
<path d="M24 6C24 6 28 14 28 20C28 22.2091 26.2091 24 24 24C21.7909 24 20 22.2091 20 20C20 14 24 6 24 6Z" fill="#F9DC07"></path>
<!-- Left green leaf wing -->
<path d="M12 14C12 14 20.5 17 21 27C17 27 8 26 6 18C5.2 14.8 12 14 12 14Z" fill="#00c853" opacity="0.95"></path>
<!-- Right green leaf wing -->
<path d="M36 14C36 14 27.5 17 27 27C31 27 40 26 42 18C42.8 14.8 36 14 36 14Z" fill="#009900"></path>
<!-- Base open book silhouette -->
<path d="M7 29C15 26.5 22 28 24 33C26 28 33 26.5 41 29C42 37 32 40 24 43C16 40 6 37 7 29Z" fill="#ffffff" opacity="0.9"></path>
</svg>
</div>
</div>
<!-- Brand Name & Subtitle -->
<h1 class="text-3xl font-extrabold tracking-tight font-heading text-white flex items-center justify-center">
<span>CScholar</span>
</h1>
<p class="text-xs uppercase tracking-wider text-emerald-200/90 font-medium mt-1">
          CEIT Thesis &amp; Capstone Repository
        </p>
</div>
<!-- Center description / purpose statement -->
<div class="relative z-10 text-center my-auto py-8 px-2 max-w-xs mx-auto">
<p class="text-sm md:text-base font-normal text-emerald-50 leading-relaxed font-body">
          Access a world of knowledge and research from the CEIT department.
        </p>
</div>
<!-- Outlined Mortarboard Watermark Graphic above the waves -->
<div class="relative z-10 flex justify-center mb-6 opacity-60">
<svg class="w-24 h-24 text-emerald-200/50" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M12 14l9-5-9-5-9 5 9 5z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 14v7" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M21 11.5v4.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Bottom Decorative Multi-toned Yellow/Orange Waves Accent -->
<div aria-hidden="true" class="brand-wave-container">
<svg class="w-full h-20 opacity-95" preserveaspectratio="none" viewbox="0 0 500 120">
<path d="M0,40 C150,110 320,-20 500,50 L500,120 L0,120 Z" fill="#FF9900" opacity="0.65"></path>
<path d="M0,60 C180,120 340,10 500,80 L500,120 L0,120 Z" fill="#F9DC07"></path>
</svg>
</div>
</section>
<!-- END: LeftBrandedPanel -->
<!-- BEGIN: RightLoginSection -->
<!-- Right clean white card for user authentication -->
<section class="w-full md:w-7/12 bg-white p-8 sm:p-12 lg:p-16 flex flex-col justify-center" data-purpose="login-form-container">
<div class="max-w-md w-full mx-auto">
<!-- Header texts -->
<header class="mb-8">
<h2 class="text-3xl font-bold font-heading text-gray-900 tracking-tight">Welcome Back!</h2>
<p class="text-sm text-gray-500 mt-1 font-body">Log in to your account</p>
</header>
<!-- Authentication Form -->
<form action="#" class="space-y-5" data-purpose="login-form" method="POST" onsubmit="return false;">
<!-- Email / Username Input Group -->
<div data-purpose="input-group-username">
<label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2" for="username">
              Email or Username
            </label>
<div class="relative">
<input class="w-full px-4 py-3 text-sm text-gray-800 bg-white border border-gray-300 rounded-lg shadow-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#009900] focus:border-[#009900] transition duration-150" id="username" name="username" placeholder="Enter your email or username" required="" type="text"/>
</div>
</div>
<!-- Password Input Group -->
<div data-purpose="input-group-password">
<label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2" for="password">
              Password
            </label>
<div class="relative">
<input class="w-full pl-4 pr-11 py-3 text-sm text-gray-800 bg-white border border-gray-300 rounded-lg shadow-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#009900] focus:border-[#009900] transition duration-150" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<!-- Password visibility toggle button -->
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none" id="password-toggle-btn" onclick="togglePasswordVisibility()" type="button">
<svg class="w-5 h-5" fill="none" id="eye-icon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<!-- Checkbox and Forgot Password Link -->
<div class="flex items-center justify-between pt-1">
<!-- Remember me checkbox -->
<label class="flex items-center space-x-2 cursor-pointer select-none">
<input class="w-4 h-4 text-[#009900] border-gray-300 rounded focus:ring-[#009900] focus:ring-offset-0 transition" id="remember-me" name="remember-me" type="checkbox"/>
<span class="text-xs sm:text-sm text-gray-600">Remember me</span>
</label>
<!-- Forgot password link -->
<a class="text-xs sm:text-sm font-medium text-[#009900] hover:text-[#007a00] hover:underline transition" href="#">
              Forgot password?
            </a>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full py-3.5 px-4 bg-[#009900] hover:bg-[#008000] active:bg-[#006e00] text-white font-medium text-sm rounded-lg shadow-sm hover:shadow-md transition duration-150 flex items-center justify-center font-heading" type="submit">
              Login
            </button>
</div>
</form>
<!-- Register Link Prompt -->
<footer class="mt-8 text-center" data-purpose="register-prompt">
<p class="text-xs sm:text-sm text-gray-600">
            Don't have an account? 
            <a class="font-semibold text-[#009900] hover:text-[#007a00] hover:underline transition ml-1" href="#">
              Register
            </a>
</p>
</footer>
</div>
</section>
<!-- END: RightLoginSection -->
</main>
<!-- END: MainLoginCardContainer -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="toggle-password-visibility">
    function togglePasswordVisibility() {
      const passwordField = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      
      if (!passwordField) return;

      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;
      } else {
        passwordField.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
      }
    }
  </script>
<!-- END: InteractiveScripts -->
</body></html>
