# Render Blueprint — CScholar API on the Free instance (512 MB RAM).
#
# Why this file exists: the Free plan has no persistent disk and only 512 MB of
# memory, so the backend must not import torch (measured at ~520 MB RSS) and
# PDFs cannot live on the local filesystem. This service therefore installs the
# ONNX embedding runtime (requirements-render.txt) and stores PDFs in Neon
# Object Storage. See docs/DEPLOY_RENDER_NEON.md for the full runbook.
#
# Secrets (DATABASE_URL, S3 credentials, CORS_ORIGINS) are marked sync: false:
# Render prompts for them once, they are never committed.

services:
  - type: web
    name: cscholar-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements-render.txt &&
      python -c "from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/all-MiniLM-L6-v2', cache_dir='.fastembed_cache')"
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "0"
      # ONNX, not torch: keeps the process under the 512 MB limit.
      - key: EMBEDDING_BACKEND
        value: fastembed
      # 0.1 CPU on Free; one ONNX thread avoids fighting itself.
      - key: FASTEMBED_THREADS
        value: "1"
      # Signs login tokens. Generated once per service.
      - key: SECRET_KEY
        generateValue: true
      # Neon connection strings. The app prefers the direct (unpooled) one
      # because it pins search_path per connection, which transaction-mode
      # pooling does not preserve. Set at least DATABASE_URL_UNPOOLED.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DATABASE_URL
        sync: false
      # The GitHub Pages origin, e.g. https://tr1tech.github.io
      - key: CORS_ORIGINS
        sync: false
      # Neon Object Storage (S3-compatible).
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
